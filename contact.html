 <style>
  :root {
    --g900: #0d2818;
    --g700: #145a32;

  .contact-card {

  .contact-card h2 {
    font-family: 'Amiri', serif;
    font-size: 1.9rem;
    color: var(--g900);

margin-bottom:6px;
    margin: 0 0 6px 0;
  }

  .contact-card > p {
    text-align: center;
    color: #3d5a45;
    margin: 0 0 22px 0;
     margin-bottom:24px;
    font-size: 1.05rem;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: var(--g700);

    text-align:center;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--g100);
    border-radius: 10px;
    font-size: 16px;
    font-family: 'Tajawal', sans-serif;
    color: var(--g900);
    background: #f9fefb;
    transition: border-color 0.25s, box-shadow 0.25s;
    box-sizing: border-box;
    text-align:center;
  }

  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--g700);
    box-shadow: 0 0 0 4px rgba(20, 90, 50, 0.12);
  }

  textarea {
    height: 140px;
    resize: vertical;
    text-align:center;
  }

  .submit-btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg, var(--g700), var(--g500));
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 6px;
margin-bottom: 0 !important;
    
  }

  .submit-btn:hover {
    background: linear-gradient(90deg, var(--g900), var(--g700));
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(20, 90, 50, 0.25);
  }

  .submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  #statusMessage {
    text-align: center;
    margin-top: 12px;
margin-bottom:0;
    font-weight: 600;
    min-height: 0;
    line-height:1.3;
    
  }
  
  /* Force the card to end right after the content */
.contact-card {
  display: flex;
  flex-direction: column;
}

.contact-card form {
  margin-bottom: 0;
}

#statusMessage:empty {
  display: none;   /* hides the status area when empty */

</style>

<div class="contact-wrapper">
  <div class="contact-card">
   
    <p>If you have any questions or suggestions, feel free to reach out to us!</p>

    <form id="contactForm" action="https://formsubmit.co/falisznalt@gmail.com" method="POST">
      <!-- FormSubmit extras (recommended) -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New message from Ahlu-Sunnah Al Islam">
      <input type="hidden" name="_template" value="table">

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
      </div>

      
      <button type="submit" class="submit-btn">Send Message</button>
    </form>

    <div id="statusMessage"></div>
  </div>
</div>

<script>
  const form = document.getElementById("contactForm");
  const statusMessage = document.getElementById("statusMessage");
  const submitBtn = form.querySelector(".submit-btn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";
    statusMessage.innerHTML = "";

    try {
      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: "POST",
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        statusMessage.innerHTML = '<span style="color:#145a32;">✓ Message sent successfully! Thank you.</span>';
        form.reset();
      } else {
        throw new Error("Server error");
      }
    } catch (error) {
      statusMessage.innerHTML = '<span style="color:#c0392b;">✗ Failed to send. Please try again later.</span>';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
</script>

<script>
  // Fill the year span with the current year (keeps the copyright range up to date)
  (function() {
    const startYear = 2024;
    const currentYear = new Date().getFullYear();
    const yearSpan = document.getElementById('year');
    if (yearSpan) {
      yearSpan.textContent = (currentYear > startYear) ? currentYear : startYear;
    }
  })();
</script>
