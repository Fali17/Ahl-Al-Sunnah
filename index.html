<script src="assets/js/main.js"></script>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
let allPosts=[];
async function loadPosts(){
  const res = await fetch('./posts.json');
  allPosts = await res.json();
  renderPosts(allPosts);
  renderLabels(allPosts);
}
function renderPosts(posts){
  const c=document.getElementById('postsList');
  if(!posts.length){c.innerHTML='<div class="post-outer"><p>No posts found.</p></div>';return;}
  c.innerHTML=posts.map(p=>{
    return '<div class="post-outer"><h3 class="post-title"><a href="posts/'+(p.slug||p.id)+'.html">'+p.title+'</a></h3><div style="text-align:center;color:#1e8449;font-size:13px;margin-bottom:8px">'+p.date+' '+(p.labels||[]).map(l=>'<span style="background:#eafaf1;border:1px solid #d5f5e3;padding:2px 8px;border-radius:20px;font-size:11px;margin:0 2px">'+l+'</span>').join('')+'</div><div class="post-body" style="font-size:16px">'+(p.snippet||'')+'</div><a class="read-more" href="posts/'+(p.slug||p.id)+'.html">Read more</a></div>';
  }).join('');
}
function renderLabels(posts){
  const map={};
  posts.forEach(p=>(p.labels||[]).forEach(l=>map[l]=(map[l]||0)+1));
  const el=document.getElementById('labelCloud');
  el.innerHTML=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([l,c])=>'<span style="background:#145a32;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer" onclick="filterLabel(\''+l.replace(/'/g,"\\'")+'\')">'+l+' ('+c+')</span>').join('') || '<span style="font-size:13px;color:#888">No labels</span>';
}
function filterLabel(l){
  const filtered=allPosts.filter(p=>(p.labels||[]).includes(l));
  renderPosts(filtered);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('searchBox')?.addEventListener('input', e=>{
  const q=e.target.value.toLowerCase();
  if(!q){renderPosts(allPosts);return;}
  const f=allPosts.filter(p=>p.title.toLowerCase().includes(q)||p.snippet.toLowerCase().includes(q)|| (p.labels||[]).join(' ').toLowerCase().includes(q));
  renderPosts(f);
});
loadPosts();
</script>
