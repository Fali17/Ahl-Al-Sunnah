<script>
// Pagination: 10 posts per page. Only the pagination buttons are centered (CSS uses .blog-pager).

document.getElementById('year').textContent = new Date().getFullYear();
let allPosts = [];
let filteredPosts = [];
const postsPerPage = 10;
let currentPage = 0;

async function loadPosts(){
  try{
    const res = await fetch('./posts.json');
    allPosts = await res.json();
  }catch(e){
    console.error('Failed to load posts.json', e);
    allPosts = [];
  }
  filteredPosts = allPosts.slice();
  renderPage();
  renderLabels(allPosts);
}

function renderPage(){
  const c = document.getElementById('postsList');
  const totalPages = Math.max(1, Math.ceil(filteredPosts.length / postsPerPage));
  if(currentPage > totalPages - 1) currentPage = totalPages - 1;
  const start = currentPage * postsPerPage;
  const pagePosts = filteredPosts.slice(start, start + postsPerPage);

  if(!pagePosts.length){
    c.innerHTML = '<div class="post-outer"><p>No posts found.</p></div>';
  } else {
    c.innerHTML = pagePosts.map(p => {
      const slugOrId = p.slug || p.id || '';
      const href = 'posts/' + slugOrId + '.html';
      const when = p.date || '';
      const snippet = p.snippet || '';
      return '<div class="post-outer">' +
             '<h3 class="post-title"><a href="' + href + '">' + escapeHtml(p.title || 'Untitled') + '</a></h3>' +
             (when ? '<div style="text-align:center;color:#1e8449;font-size:13px;margin-bottom:8px">' + escapeHtml(when) + '</div>' : '') +
             '<div class="post-body"><p>' + escapeHtml(snippet) + '</p></div>' +
             '</div>';
    }).join('');
  }

  updatePager(totalPages);
}

function updatePager(totalPages){
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  const info = document.getElementById('pageInfo');

  prev.disabled = currentPage === 0;
  next.disabled = currentPage >= totalPages - 1 || totalPages === 0;
  info.textContent = filteredPosts.length ? 'Page ' + (currentPage + 1) + ' of ' + totalPages + ' (' + filteredPosts.length + ' posts)' : '';
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if(currentPage > 0){
    currentPage--;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

document.getElementById('nextBtn').addEventListener('click', () => {
  const totalPages = Math.max(1, Math.ceil(filteredPosts.length / postsPerPage));
  if(currentPage < totalPages - 1){
    currentPage++;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

function renderLabels(posts){
  const map = {};
  (posts || []).forEach(p => (p.labels || []).forEach(l => map[l] = (map[l] || 0) + 1));
  const el = document.getElementById('labelCloud');
  el.innerHTML = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0,20).map(([l,c]) => '<span style="background:#145a32;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;transition:all 0.2s ease;" onmouseover="this.style.background=\'#196f3d\'" onmouseout="this.style.background=\'#145a32\'" onclick="filterLabel(\'' + escapeHtmlAttr(l) + '\')">' + escapeHtml(l) + ' (' + c + ')</span>').join('');
}

function filterLabel(l){
  filteredPosts = allPosts.filter(p => (p.labels || []).includes(l));
  currentPage = 0;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Search integrates with pagination
const searchBox = document.getElementById('searchBox');
searchBox?.addEventListener('input', e => {
  const q = (e.target.value || '').toLowerCase().trim();
  if(!q){
    filteredPosts = allPosts.slice();
  } else {
    filteredPosts = allPosts.filter(p => {
      const title = (p.title || '').toLowerCase();
      const snippet = (p.snippet || '').toLowerCase();
      const labels = ((p.labels || []).join(' ') || '').toLowerCase();
      return title.includes(q) || snippet.includes(q) || labels.includes(q);
    });
  }
  currentPage = 0;
  renderPage();
});

// helpers to avoid XSS
function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeHtmlAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;'); }

loadPosts();
</script>
